<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scry</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#0f1115" />
  <style>
    :root {
      --bg: #0f1115;
      --panel: #151820;
      --panel-2: #1b1f29;
      --hover: #212634;
      --active: #262c3d;
      --border: #262b36;
      --text: #e6e8ee;
      --muted: #8a91a3;
      --faint: #5d6475;
      --accent: #6d8cff;
      --accent-2: #8b6dff;
      --user-bubble: linear-gradient(135deg, #5a7bff, #7b5cff);
      --user-text: #fff;
      --agent-bubble: #1b1f29;
      --code-bg: #0b0d12;
      --warn: #f0a35e;
      --ok: #4fc08d;
      --mark: rgba(255, 213, 79, .28);
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.18);
      color-scheme: dark;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f7fb;
        --panel: #ffffff;
        --panel-2: #f1f3f8;
        --hover: #eef0f6;
        --active: #e4e8f5;
        --border: #e2e5ee;
        --text: #1b1f2a;
        --muted: #636b7e;
        --faint: #9aa1b2;
        --agent-bubble: #ffffff;
        --code-bg: #f3f4f8;
        --mark: rgba(255, 196, 0, .35);
        --shadow: 0 1px 2px rgba(20,30,60,.06), 0 4px 16px rgba(20,30,60,.06);
        color-scheme: light;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }
    button, input, select { font: inherit; color: inherit; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    /* Header */
    header {
      display: flex; align-items: center; gap: 12px; padding: 10px 16px;
      background: var(--panel); border-bottom: 1px solid var(--border); flex: none;
    }
    .brand { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 16px; letter-spacing: .2px; white-space: nowrap; }
    .brand .orb {
      width: 22px; height: 22px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #c9d4ff, var(--accent) 45%, var(--accent-2) 100%);
      box-shadow: 0 0 12px rgba(109,140,255,.55);
    }
    .select-wrap { position: relative; }
    .select-wrap::after {
      content: ""; position: absolute; right: 11px; top: 50%; width: 6px; height: 6px; margin-top: -5px;
      border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg); pointer-events: none;
    }
    select {
      appearance: none; padding: 7px 30px 7px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--panel-2); cursor: pointer; max-width: 220px;
    }
    .search {
      flex: 1; display: flex; align-items: center; gap: 8px; max-width: 640px;
      padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2);
    }
    .search:focus-within, select:focus, .filter:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(109,140,255,.18); }
    .search input { flex: 1; border: 0; background: transparent; padding: 7px 0; outline: none; min-width: 0; }
    .search svg { flex: none; color: var(--faint); }
    kbd { font: 11px ui-monospace, monospace; color: var(--faint); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2);
      cursor: pointer; color: var(--muted); white-space: nowrap;
    }
    .icon-btn:hover { background: var(--hover); color: var(--text); }
    .spacer { flex: 1; }

    /* Layout */
    main { flex: 1; display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
    aside { display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--panel); min-height: 0; }
    .aside-head { padding: 12px 12px 8px; display: flex; flex-direction: column; gap: 8px; }
    .aside-title { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px; }
    .aside-title h2 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
    .count { font-size: 12px; color: var(--faint); }
    .filter { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); }
    #sessions { overflow-y: auto; padding: 4px 8px 16px; flex: 1; }
    .sess {
      display: block; width: 100%; text-align: left; border: 0; background: transparent; cursor: pointer;
      padding: 10px 10px; border-radius: 10px; margin-bottom: 2px; border: 1px solid transparent;
    }
    .sess:hover { background: var(--hover); }
    .sess.active { background: var(--active); border-color: var(--border); }
    .sess .title { font-weight: 550; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .sess .id { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
    .sess .times { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11.5px; color: var(--faint); margin-top: 4px; }
    .sess .times span { white-space: nowrap; }
    .chip {
      display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
      background: rgba(109,140,255,.14); color: var(--accent); font-weight: 550; vertical-align: 1px;
    }
    .chip.none { background: var(--panel-2); color: var(--muted); }
    .chip.warn { background: rgba(240,163,94,.15); color: var(--warn); }

    #content { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .empty {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      color: var(--muted); text-align: center; padding: 24px;
    }
    .empty .big-orb { width: 64px; height: 64px; border-radius: 50%; opacity: .9;
      background: radial-gradient(circle at 35% 30%, #c9d4ff, var(--accent) 45%, var(--accent-2) 100%);
      box-shadow: 0 0 40px rgba(109,140,255,.45); margin-bottom: 8px; }
    .empty h3 { margin: 0; color: var(--text); font-weight: 600; }
    .empty p { margin: 0; max-width: 440px; font-size: 13px; }
    .placeholder { padding: 24px; color: var(--muted); text-align: center; font-size: 13px; }

    /* Session view */
    .chat-head {
      flex: none; display: flex; align-items: center; gap: 12px; padding: 12px 20px;
      border-bottom: 1px solid var(--border); background: var(--panel);
    }
    .chat-head .info { min-width: 0; flex: 1; }
    .chat-head h1 { margin: 0; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-head .sub { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); margin-top: 2px; }
    .back { display: none; }
    #scroller { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
    .thread { max-width: 920px; margin: 0 auto; padding: 24px 20px 64px; display: flex; flex-direction: column; gap: 14px; }
    .day { align-self: center; font-size: 11.5px; color: var(--faint); background: var(--panel-2); padding: 2px 12px; border-radius: 999px; margin: 8px 0; }
    .msg { display: flex; gap: 10px; max-width: 100%; border-radius: 14px; transition: background .6s; }
    .msg.user { flex-direction: row-reverse; }
    .avatar {
      flex: none; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; margin-top: 2px;
    }
    .msg.agent .avatar { background: radial-gradient(circle at 35% 30%, #c9d4ff, var(--accent) 50%, var(--accent-2)); color: #fff; }
    .msg.user .avatar { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }
    .stack { display: flex; flex-direction: column; gap: 4px; min-width: 0; max-width: min(760px, 85%); }
    .msg.user .stack { align-items: flex-end; }
    .bubble { padding: 10px 14px; border-radius: 16px; overflow-wrap: anywhere; min-width: 0; max-width: 100%; }
    .msg.user .bubble { background: var(--user-bubble); color: var(--user-text); border-bottom-right-radius: 5px; white-space: pre-wrap; box-shadow: var(--shadow); }
    .msg.agent .bubble { background: var(--agent-bubble); border: 1px solid var(--border); border-bottom-left-radius: 5px; box-shadow: var(--shadow); }
    .meta { font-size: 11px; color: var(--faint); padding: 0 6px; display: flex; gap: 6px; align-items: center; }
    .msg.highlight { background: var(--mark); }
    details.thinking, details.tool, details.event {
      border: 1px dashed var(--border); border-radius: 10px; padding: 6px 10px; font-size: 13px; color: var(--muted); max-width: 100%;
    }
    details.tool { border-style: solid; background: var(--panel-2); }
    details summary { cursor: pointer; user-select: none; list-style: none; display: flex; align-items: center; gap: 6px; }
    details summary::-webkit-details-marker { display: none; }
    details summary::before { content: "▸"; font-size: 10px; transition: transform .15s; }
    details[open] summary::before { transform: rotate(90deg); }
    details .body { margin-top: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
    details pre { margin: 6px 0 0; max-height: 360px; overflow: auto; }
    .event-row { align-self: center; max-width: 90%; }
    .sys { align-self: center; font-size: 12px; color: var(--muted); background: var(--panel-2); padding: 4px 12px; border-radius: 999px; max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Markdown */
    .md > :first-child { margin-top: 0; }
    .md > :last-child { margin-bottom: 0; }
    .md p { margin: 0 0 .7em; }
    .md h1, .md h2, .md h3, .md h4 { margin: 1em 0 .4em; line-height: 1.3; }
    .md h1 { font-size: 1.3em; } .md h2 { font-size: 1.15em; } .md h3, .md h4 { font-size: 1em; }
    .md ul, .md ol { margin: 0 0 .7em; padding-left: 1.4em; }
    .md li { margin: .15em 0; }
    .md a { color: var(--accent); }
    .md blockquote { margin: 0 0 .7em; padding-left: 12px; border-left: 3px solid var(--border); color: var(--muted); }
    .md code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code-bg); padding: 1px 5px; border-radius: 5px; }
    pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; overflow-x: auto; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
    pre code { background: none; padding: 0; }
    .md pre { margin: 0 0 .7em; }
    .md table { border-collapse: collapse; margin: 0 0 .7em; display: block; overflow-x: auto; }
    .md th, .md td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
    .md hr { border: 0; border-top: 1px solid var(--border); margin: 1em 0; }

    /* Search results */
    .results { max-width: 980px; width: 100%; margin: 0 auto; padding: 16px 20px 48px; }
    .results-head { font-size: 13px; color: var(--muted); margin: 4px 0 12px; }
    .hit {
      display: block; width: 100%; text-align: left; cursor: pointer; padding: 10px 12px; margin-bottom: 8px;
      border-radius: 10px; border: 1px solid var(--border); background: var(--panel);
    }
    .hit:hover { border-color: var(--accent); }
    .hit.static { cursor: default; }
    .hit.static:hover { border-color: var(--border); }
    .hit .loc { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .hit .snippet { font-size: 12.5px; white-space: pre-wrap; word-break: break-all; margin-top: 4px; }
    mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }

    /* Project dialog */
    dialog {
      border: 1px solid var(--border); border-radius: 14px; padding: 0; width: min(520px, calc(100vw - 32px));
      background: var(--panel); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    dialog::backdrop { background: rgba(5,8,15,.55); backdrop-filter: blur(2px); }
    .dlg { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .dlg h2 { margin: 0; font-size: 16px; }
    .dlg p { margin: 0; color: var(--muted); font-size: 13px; }
    .dlg label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
    .dlg input { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); }
    .dlg input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(109,140,255,.18); }
    .dlg .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
    .dlg .error { color: #ff7b7b; font-size: 13px; min-height: 0; }
    .primary { padding: 7px 14px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; cursor: pointer; font-weight: 550; }
    .primary:hover { filter: brightness(1.08); }
    .primary.danger { background: #d9534f; }
    .primary:disabled { opacity: .6; cursor: default; }
    .secret {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px;
      background: var(--code-bg); border: 1px solid var(--border);
    }
    .secret code { flex: 1; overflow-wrap: anywhere; font-size: 12.5px; }
    .dlg pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; background: none; border: 0; padding: 0; flex: 1; }
    .notice { font-size: 12.5px; color: var(--warn); background: rgba(240,163,94,.1); border-radius: 8px; padding: 8px 10px; }
    .dlg .check { flex-direction: row; align-items: center; gap: 8px; }
    .dlg .check input { width: auto; }
    .locked-note { margin: 10px; padding: 10px 12px; border: 1px dashed var(--border); border-radius: 10px; font-size: 12.5px; color: var(--muted); }
    .locked-note button { margin-top: 8px; }

    @media (max-width: 760px) {
      header { flex-wrap: wrap; }
      .search { order: 3; flex-basis: 100%; max-width: none; }
      .hide-sm { display: none; }
      main { grid-template-columns: 1fr; }
      body.viewing aside { display: none; }
      body:not(.viewing) #content { display: none; }
      .back { display: inline-flex; }
      .stack { max-width: 90%; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/" title="Scry home"><div class="orb"></div>Scry</a>
    <div class="select-wrap">
      <select id="project" title="Project"></select>
    </div>
    <button class="icon-btn" id="new-project" title="Create a project and its ingest token">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
      <span class="hide-sm">New project</span>
    </button>
    <button class="icon-btn" id="token-btn" title="Generate a new ingest token for this project" hidden>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.3-9.3M17 6l3 3M14.5 8.5l2.5 2.5"/></svg>
      <span class="hide-sm">Token</span>
    </button>
    <button class="icon-btn" id="lock-btn" title="Lock this project: forget its token in this browser" hidden>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <span class="hide-sm">Lock</span>
    </button>
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Search unlocked transcripts…" autocomplete="off" />
      <kbd class="hide-sm">/</kbd>
    </label>
    <div class="spacer"></div>
    <button class="icon-btn" id="refresh" title="Refresh">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      <span class="hide-sm">Refresh</span>
    </button>
  </header>

  <main>
    <aside>
      <div class="aside-head">
        <div class="aside-title"><h2>Sessions</h2><span class="count" id="count"></span></div>
        <input class="filter" id="filter" placeholder="Filter by name or id…" autocomplete="off" />
      </div>
      <div id="sessions"><div class="placeholder">Loading…</div></div>
    </aside>
    <section id="content"></section>
  </main>
  <dialog id="dlg"></dialog>

  <script>
    // The UI always talks HTTP to the server that served it: server.js, or the
    // Electron app's own local server (main.js loads this page from it).
    //
    // scry is end-to-end encrypted (lib/crypto.js has the scheme). The server
    // only ever holds ciphertext: this page makes each project's token, derives
    // the keys from it, and decrypts sessions here. A project is readable once
    // it is unlocked with its token; tokens never leave this browser, only the
    // auth key derived from them does (X-Scry-Key).
    const enc = new TextEncoder();
    const dec = new TextDecoder();
    const b64u = (buf) => {
      const bytes = new Uint8Array(buf);
      let bin = '';
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    };
    const unb64u = (str) => {
      const t = str.replace(/-/g, '+').replace(/_/g, '/');
      const bin = atob(t + '==='.slice((t.length + 3) % 4));
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    };
    const cat = (a, b) => { const o = new Uint8Array(a.length + b.length); o.set(a); o.set(b, a.length); return o; };
    const E2E = {
      available: () => Boolean(window.crypto && crypto.subtle),
      newToken: () => 'scry_' + b64u(crypto.getRandomValues(new Uint8Array(32))),
      async hkdf(token, info) {
        const base = await crypto.subtle.importKey('raw', enc.encode(token), 'HKDF', false, ['deriveBits']);
        return new Uint8Array(await crypto.subtle.deriveBits(
          { name: 'HKDF', hash: 'SHA-256', salt: enc.encode('scry'), info: enc.encode(info) }, base, 256));
      },
      async authKey(token) { return b64u(await E2E.hkdf(token, 'scry/v1/auth')); },
      async kek(token) {
        return crypto.subtle.importKey('raw', await E2E.hkdf(token, 'scry/v1/kek'), 'AES-GCM', false, ['encrypt', 'decrypt']);
      },
      async wrap(token, project, rawKey) {
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const ct = await crypto.subtle.encrypt(
          { name: 'AES-GCM', iv, additionalData: enc.encode(`scry/v1/key:${project}`) }, await E2E.kek(token), rawKey);
        return b64u(cat(iv, new Uint8Array(ct)));
      },
      async unwrap(token, project, wrapped) {
        const buf = unb64u(wrapped);
        return new Uint8Array(await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: buf.subarray(0, 12), additionalData: enc.encode(`scry/v1/key:${project}`) },
          await E2E.kek(token), buf.subarray(12)));
      },
      dataKey: (raw) => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']),
      // A stored line's plaintext, or null when the line is not encrypted.
      async decryptLine(key, project, raw) {
        let o;
        try { o = JSON.parse(raw); } catch (_) { return null; }
        if (!o || o.v !== 1 || typeof o.iv !== 'string' || typeof o.ct !== 'string') return null;
        const pt = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: unb64u(o.iv), additionalData: enc.encode(`scry/v1/line:${project}`) }, key, unb64u(o.ct));
        return dec.decode(pt);
      },
    };

    // Unlocked projects: name -> { token, authKey, rawKey, key }.
    const unlocked = new Map();
    const authHeaders = (project) => {
      const u = unlocked.get(project);
      return u ? { 'x-scry-key': u.authKey } : {};
    };

    const getJson = async (p, headers = {}) => {
      const res = await fetch(p, { headers });
      if (!res.ok) {
        let msg = `HTTP ${res.status}`;
        try { msg = (await res.json()).error || msg; } catch (_) { /* no body */ }
        throw new Error(msg);
      }
      return res.json();
    };
    const postJson = async (p, body, headers = {}) => {
      const res = await fetch(p, { method: 'POST', headers: { 'content-type': 'application/json', ...headers }, body: JSON.stringify(body) });
      let data = {};
      try { data = await res.json(); } catch (_) { /* no body */ }
      if (!res.ok) return { error: data.error || `HTTP ${res.status}` };
      return data;
    };
    const scry = {
      projects: () => getJson('projects'),
      createProject: (name, keys) => postJson('projects', { name, ...keys }),
      rotateToken: (name, keys) => postJson('projects/token', { name, ...keys }, authHeaders(name)),
      wrappedKey: (authKey) => getJson('ingest/key', { 'x-scry-key': authKey }),
      sessions: (project) => getJson('sessions?project=' + encodeURIComponent(project), authHeaders(project)),
      session: (project, id) => getJson(`session?project=${encodeURIComponent(project)}&id=${encodeURIComponent(id)}`, authHeaders(project)),
    };

    const $ = (id) => document.getElementById(id);
    const projectSel = $('project');
    const qInput = $('q');
    const filterInput = $('filter');
    const listEl = $('sessions');
    const content = $('content');
    const ALL = '__all__';

    const store = {
      get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch (_) { /* ignore */ } },
    };

    // Tokens kept in this browser so projects stay unlocked across reloads:
    // sessionStorage (this tab) by default, localStorage when "remember" is ticked.
    const tokenStore = {
      read(area) {
        try { return JSON.parse(window[area].getItem('scry.tokens') || '{}') || {}; } catch (_) { return {}; }
      },
      write(area, obj) {
        try { window[area].setItem('scry.tokens', JSON.stringify(obj)); } catch (_) { /* ignore */ }
      },
      all() { return { ...tokenStore.read('sessionStorage'), ...tokenStore.read('localStorage') }; },
      set(project, token, remember) {
        for (const area of ['sessionStorage', 'localStorage']) {
          const o = tokenStore.read(area);
          if (area === 'localStorage' && !remember) delete o[project]; else o[project] = token;
          tokenStore.write(area, o);
        }
      },
      remove(project) {
        for (const area of ['sessionStorage', 'localStorage']) {
          const o = tokenStore.read(area);
          delete o[project];
          tokenStore.write(area, o);
        }
      },
      remembered(project) { return project in tokenStore.read('localStorage'); },
    };

    // Unlocks a project with its token: answers null, or an error message.
    async function unlockProject(project, token, remember) {
      if (!E2E.available()) return 'This browser cannot decrypt here: open scry over https (or on localhost).';
      token = token.trim();
      try {
        const authKey = await E2E.authKey(token);
        const r = await scry.wrappedKey(authKey);
        if (r.project !== project) return `That token belongs to “${r.project}”, not “${project}”.`;
        const rawKey = await E2E.unwrap(token, project, r.wrappedKey);
        unlocked.set(project, { token, authKey, rawKey, key: await E2E.dataKey(rawKey) });
        tokenStore.set(project, token, remember);
        return null;
      } catch (err) {
        return /HTTP 401|invalid project key/.test(err.message) ? 'That is not this project’s token.' : `Could not unlock: ${err.message}`;
      }
    }
    async function unlockSaved() {
      const saved = tokenStore.all();
      await Promise.all(Object.entries(saved).map(async ([project, token]) => {
        if (unlocked.has(project)) return;
        if (!projectsInfo.some((p) => p.name === project && p.hasKey)) return;
        if (await unlockProject(project, token, tokenStore.remembered(project))) tokenStore.remove(project);
      }));
    }
    function lockProject(project) {
      unlocked.delete(project);
      tokenStore.remove(project);
      for (const k of [...sessionCache.keys()]) if (k.startsWith(project + '/')) sessionCache.delete(k);
    }

    let sessions = [];
    let current = null; // { project, id }

    const selectedProject = () => {
      const v = projectSel.value;
      return v === ALL || !v ? null : v;
    };
    // The projects a view covers: the selected one, or every unlocked one.
    const scopeProjects = () => {
      const p = selectedProject();
      return p === null ? [...unlocked.keys()].sort() : unlocked.has(p) ? [p] : [];
    };
    const projectLabel = (p) => p;
    const projectChip = (p) => el('span', { className: 'chip' }, projectLabel(p));

    // Text of a user prompt in either the chat-logger format or a raw Claude
    // Code transcript line; '' when the line is not a user prompt.
    function promptText(obj) {
      if (!obj || typeof obj !== 'object') return '';
      if (obj.kind === 'prompt' && typeof obj.prompt === 'string') return obj.prompt;
      if (obj.type === 'user' && obj.message) {
        const c = obj.message.content;
        if (typeof c === 'string') return c;
        if (Array.isArray(c)) {
          const t = c.find((b) => b && b.type === 'text' && typeof b.text === 'string');
          if (t) return t.text;
        }
      }
      return '';
    }

    // Decrypts stored lines ({ line, raw }) into { line, text, data?, plain?, error? }:
    // `text` is the plaintext line, `data` its JSON, `plain` marks a line
    // stored unencrypted (from before encryption; scripts/scry-crypt.js migrate).
    async function decryptLines(project, lines) {
      const u = unlocked.get(project);
      return Promise.all(lines.map(async ({ line, raw }) => {
        let text;
        let plain = false;
        try {
          text = await E2E.decryptLine(u.key, project, raw);
        } catch (_) {
          return { line, error: true, text: '' };
        }
        if (text === null) { text = raw; plain = true; }
        let data;
        try { data = JSON.parse(text); } catch (_) { data = undefined; }
        return { line, text, data, plain };
      }));
    }

    // Title and first timestamp of a session, from its decrypted head lines.
    const headCache = new Map(); // first raw line -> { title, createdAt }
    async function headMeta(s) {
      if (!s.head || !s.head.length) return {};
      const k = s.project + '\n' + s.head.join('\n');
      if (headCache.has(k)) return headCache.get(k);
      let title = '';
      let createdAt = null;
      for (const e of await decryptLines(s.project, s.head.map((raw, i) => ({ line: i + 1, raw })))) {
        if (!e.data) continue;
        const ts = e.data.ts || e.data.timestamp;
        if (!createdAt && ts && !Number.isNaN(Date.parse(ts))) createdAt = new Date(ts).toISOString();
        if (!title) title = promptText(e.data).trim().replace(/\s+/g, ' ').slice(0, 160);
      }
      const meta = { title, createdAt };
      headCache.set(k, meta);
      return meta;
    }

    // Decrypted sessions, re-fetched when their size changes (they only grow).
    const sessionCache = new Map(); // "project/id" -> { size, s, entries }
    async function loadSession(project, id, size) {
      const k = `${project}/${id}`;
      const c = sessionCache.get(k);
      if (c && size !== undefined && c.size === size) return c;
      const s = await scry.session(project, id);
      const entries = await decryptLines(project, s.lines);
      const v = { size: s.size, s, entries };
      sessionCache.set(k, v);
      return v;
    }

    function el(tag, props = {}, ...children) {
      const n = document.createElement(tag);
      for (const [k, v] of Object.entries(props)) {
        if (k === 'dataset') Object.assign(n.dataset, v);
        else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
        else n[k] = v;
      }
      for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) n.append(c);
      return n;
    }

    // ---------- time formatting ----------
    const fmtFull = (iso) => new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
    const fmtTime = (iso) => new Date(iso).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    const fmtDay = (iso) => new Date(iso).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    function fmtRel(iso) {
      const s = (Date.now() - new Date(iso).getTime()) / 1000;
      if (s < 45) return 'just now';
      if (s < 3600) return `${Math.round(s / 60)}m ago`;
      if (s < 86400) return `${Math.round(s / 3600)}h ago`;
      if (s < 86400 * 7) return `${Math.round(s / 86400)}d ago`;
      return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }
    const fmtShort = (iso) => new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });

    // ---------- markdown (escape first, then a small safe subset) ----------
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    function inline(s) {
      const codes = [];
      s = s.replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
      s = esc(s)
        .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`)
        .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (_, pre, u) => `${pre}<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`)
        .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<em>$2</em>')
        .replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
      return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[+i])}</code>`);
    }
    function markdown(src) {
      const lines = String(src).replace(/\r\n?/g, '\n').split('\n');
      let html = '';
      let i = 0;
      const isTableSep = (l) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
      const cells = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      while (i < lines.length) {
        const line = lines[i];
        let m;
        if ((m = /^\s*(```+|~~~+)\s*([\w+-]*)/.exec(line))) {
          const fence = m[1];
          const buf = [];
          i++;
          while (i < lines.length && !lines[i].trim().startsWith(fence)) buf.push(lines[i++]);
          i++;
          html += `<pre><code>${esc(buf.join('\n'))}</code></pre>`;
        } else if (!line.trim()) {
          i++;
        } else if ((m = /^(#{1,6})\s+(.*)$/.exec(line))) {
          const lvl = Math.min(m[1].length, 4);
          html += `<h${lvl}>${inline(m[2])}</h${lvl}>`;
          i++;
        } else if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) {
          html += '<hr>';
          i++;
        } else if (/^\s*>/.test(line)) {
          const buf = [];
          while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ''));
          html += `<blockquote>${markdown(buf.join('\n'))}</blockquote>`;
        } else if (line.includes('|') && i + 1 < lines.length && isTableSep(lines[i + 1])) {
          const head = cells(line);
          i += 2;
          let body = '';
          while (i < lines.length && lines[i].includes('|') && lines[i].trim()) {
            body += '<tr>' + cells(lines[i++]).map((c) => `<td>${inline(c)}</td>`).join('') + '</tr>';
          }
          html += `<table><thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`;
        } else if ((m = /^(\s*)([-*+]|\d+[.)])\s+/.exec(line))) {
          const ordered = /\d/.test(m[2]);
          const items = [];
          while (i < lines.length) {
            const lm = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(lines[i]);
            if (lm && lm[1].length <= m[1].length + 1) { items.push(lm[3]); i++; }
            else if (lines[i].trim() && /^\s+/.test(lines[i]) && items.length) { items[items.length - 1] += '\n' + lines[i].trim(); i++; }
            else break;
          }
          const tag = ordered ? 'ol' : 'ul';
          html += `<${tag}>${items.map((t) => `<li>${inline(t).replace(/\n/g, '<br>')}</li>`).join('')}</${tag}>`;
        } else {
          const buf = [];
          while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|\s*(```|~~~)|\s*>|\s*([-*+]|\d+[.)])\s)/.test(lines[i])) buf.push(lines[i++]);
          if (!buf.length) buf.push(lines[i++]);
          html += `<p>${buf.map(inline).join('<br>')}</p>`;
        }
      }
      return html;
    }
    const mdNode = (text) => { const d = el('div', { className: 'md' }); d.innerHTML = markdown(text); return d; };

    // ---------- projects ----------
    let projectsInfo = [];
    async function loadProjects(select) {
      try { projectsInfo = await scry.projects(); } catch (_) { /* keep previous */ }
      const saved = store.get('scry.project');
      const prev = select || projectSel.value || saved || ALL;
      projectSel.innerHTML = '';
      projectSel.append(el('option', { value: ALL }, 'All projects'));
      await unlockSaved();
      for (const p of projectsInfo) {
        const label = p.name + (!p.hasKey ? ' (no token)' : unlocked.has(p.name) ? '' : ' 🔒');
        projectSel.append(el('option', { value: p.name }, label));
      }
      projectSel.value = [...projectSel.options].some((o) => o.value === prev) ? prev : ALL;
      updateTokenButton();
    }
    function updateTokenButton() {
      const p = selectedProject();
      $('token-btn').hidden = !p;
      $('lock-btn').hidden = !p || !unlocked.has(p);
    }

    // ---------- project dialog ----------
    const dlg = $('dlg');
    const ingestUrl = new URL('ingest', location.href).href;

    async function copyButton(text, label = 'Copy') {
      const b = el('button', {
        className: 'icon-btn', type: 'button',
        onclick: async () => {
          try { await navigator.clipboard.writeText(text); b.textContent = 'Copied'; } catch (_) { b.textContent = 'Copy failed'; }
          setTimeout(() => { b.textContent = label; }, 1400);
        },
      }, label);
      return b;
    }

    function openDialog(...children) {
      dlg.innerHTML = '';
      dlg.append(el('div', { className: 'dlg' }, ...children));
      if (!dlg.open) dlg.showModal();
    }

    async function showToken({ name, token }, fresh) {
      const env = `SCRY_PROJECT=${name}\nSCRY_INGEST_URL=${ingestUrl}\nSCRY_INGEST_TOKEN=${token}`;
      openDialog(
        el('h2', {}, fresh ? `Project “${name}” created` : `New token for “${name}”`),
        el('div', { className: 'notice' },
          'Copy this token now and keep it safe. It is the only key to this project’s sessions: it never leaves this browser, the server cannot show it again, and without it nobody — scry included — can read them.'),
        el('div', { className: 'secret' }, el('code', { className: 'mono' }, token), await copyButton(token)),
        el('p', {}, 'Set these in the Claude environment that should log to this project (store the token as a secret). The chat-logger plugin encrypts each line before sending it.'),
        el('div', { className: 'secret' }, el('pre', { className: 'mono' }, env), await copyButton(env, 'Copy all')),
        fresh ? null : el('p', {}, 'The previous token no longer works, for sending or reading. Existing sessions stay readable with the new one.'),
        el('div', { className: 'actions' }, el('button', { className: 'primary', type: 'button', onclick: () => dlg.close() }, 'Done')),
      );
    }

    function newProjectDialog() {
      const input = el('input', { placeholder: 'e.g. work', autocomplete: 'off', maxLength: 128 });
      const err = el('div', { className: 'error' });
      const submit = el('button', { className: 'primary', type: 'submit' }, 'Create project');
      const form = el('form', {
        className: 'dlg',
        onsubmit: async (e) => {
          e.preventDefault();
          err.textContent = '';
          const name = input.value.trim();
          if (!name) { err.textContent = 'Enter a name.'; return; }
          if (!E2E.available()) { err.textContent = 'This browser cannot encrypt here: open scry over https (or on localhost).'; return; }
          submit.disabled = true;
          const token = E2E.newToken();
          const rawKey = crypto.getRandomValues(new Uint8Array(32));
          const r = await (async () => scry.createProject(name, {
            authKey: await E2E.authKey(token),
            wrappedKey: await E2E.wrap(token, name, rawKey),
          }))().catch((e2) => ({ error: e2.message }));
          submit.disabled = false;
          if (r.error) { err.textContent = r.error; return; }
          store.set('scry.project', r.name);
          await loadProjects(r.name);
          await unlockProject(r.name, token, false);
          await loadProjects(r.name);
          await loadSessions();
          route();
          showToken({ name: r.name, token }, true);
        },
      },
        el('h2', {}, 'New project'),
        el('p', {}, 'A project holds one Claude account’s sessions, end-to-end encrypted with its own token. The token is made here in your browser; scry stores only ciphertext and cannot read the sessions.'),
        el('label', {}, 'Name', input),
        err,
        el('div', { className: 'actions' },
          el('button', { className: 'icon-btn', type: 'button', onclick: () => dlg.close() }, 'Cancel'),
          submit),
      );
      dlg.innerHTML = '';
      dlg.append(form);
      dlg.showModal();
      input.focus();
    }

    function unlockDialog(name) {
      const input = el('input', { placeholder: 'scry_…', autocomplete: 'off', type: 'password', spellcheck: false });
      const remember = el('input', { type: 'checkbox' });
      const err = el('div', { className: 'error' });
      const submit = el('button', { className: 'primary', type: 'submit' }, 'Unlock');
      const form = el('form', {
        className: 'dlg',
        onsubmit: async (e) => {
          e.preventDefault();
          err.textContent = '';
          if (!input.value.trim()) { err.textContent = 'Paste the token.'; return; }
          submit.disabled = true;
          const msg = await unlockProject(name, input.value, remember.checked);
          submit.disabled = false;
          if (msg) { err.textContent = msg; return; }
          dlg.close();
          await loadProjects(name);
          await loadSessions();
          route();
        },
      },
        el('h2', {}, `Unlock “${name}”`),
        el('p', {}, 'Sessions are encrypted with this project’s token. Paste it to decrypt them in this browser; the token itself is never sent to the server.'),
        el('label', {}, 'Token', input),
        el('label', { className: 'check' }, remember, 'Remember on this device'),
        err,
        el('div', { className: 'actions' },
          el('button', { className: 'icon-btn', type: 'button', onclick: () => dlg.close() }, 'Cancel'),
          submit),
      );
      dlg.innerHTML = '';
      dlg.append(form);
      dlg.showModal();
      input.focus();
    }

    function tokenDialog() {
      const name = selectedProject();
      if (!name) return;
      const info = projectsInfo.find((p) => p.name === name);
      const has = info && info.hasKey;
      if (has && !unlocked.has(name)) {
        openDialog(
          el('h2', {}, `Replace the token for “${name}”`),
          el('p', {}, 'Unlock the project with its current token first: the new token has to carry the same encryption key. If the current token is lost, the sessions cannot be decrypted by anyone; create a new project instead.'),
          el('div', { className: 'actions' },
            el('button', { className: 'icon-btn', type: 'button', onclick: () => dlg.close() }, 'Cancel'),
            el('button', { className: 'primary', type: 'button', onclick: () => unlockDialog(name) }, 'Unlock')),
        );
        return;
      }
      const err = el('div', { className: 'error' });
      const go = el('button', {
        className: 'primary' + (has ? ' danger' : ''), type: 'button',
        onclick: async () => {
          if (!E2E.available()) { err.textContent = 'This browser cannot encrypt here: open scry over https (or on localhost).'; return; }
          go.disabled = true;
          const token = E2E.newToken();
          // Same data key under the new token, or a fresh one for a project without a key.
          const rawKey = has ? unlocked.get(name).rawKey : crypto.getRandomValues(new Uint8Array(32));
          const r = await (async () => scry.rotateToken(name, {
            authKey: await E2E.authKey(token),
            wrappedKey: await E2E.wrap(token, name, rawKey),
          }))().catch((e2) => ({ error: e2.message }));
          go.disabled = false;
          if (r.error) { err.textContent = r.error; return; }
          const remember = tokenStore.remembered(name);
          unlocked.delete(name);
          await loadProjects(name);
          await unlockProject(name, token, remember);
          await loadProjects(name);
          await loadSessions();
          showToken({ name, token }, false);
        },
      }, has ? 'Replace token' : 'Generate token');
      openDialog(
        el('h2', {}, `Token for “${name}”`),
        el('p', {}, has
          ? `This project has a token${info.tokenCreatedAt ? `, created ${fmtFull(info.tokenCreatedAt)}` : ''}. Replacing it makes a new one here and stops the current token from working, for sending and for reading. Sessions stay readable with the new token.`
          : 'This project has no token yet, so nothing can be sent to it or read from it. Generate one to start; it also sets the project’s encryption key. Sessions stored before scry was encrypted need scripts/scry-crypt.js migrate afterwards.'),
        err,
        el('div', { className: 'actions' },
          el('button', { className: 'icon-btn', type: 'button', onclick: () => dlg.close() }, 'Cancel'),
          go),
      );
    }

    // ---------- session list ----------
    let listSeq = 0;
    async function loadSessions() {
      const seq = ++listSeq;
      let list;
      try {
        list = (await Promise.all(scopeProjects().map((p) => scry.sessions(p)))).flat();
        await Promise.all(list.map(async (s) => {
          const m = await headMeta(s).catch(() => ({}));
          s.title = m.title || '';
          if (m.createdAt) s.createdAt = m.createdAt;
          delete s.head;
        }));
      } catch (err) {
        if (seq !== listSeq) return;
        listEl.innerHTML = '';
        listEl.append(el('div', { className: 'placeholder' }, `Could not load sessions: ${err.message}`));
        return;
      }
      if (seq !== listSeq) return;
      list.sort((a, b) => (a.updatedAt < b.updatedAt ? 1 : a.updatedAt > b.updatedAt ? -1 : 0));
      sessions = list;
      renderList();
    }

    // Projects in the current scope that are still locked.
    const lockedInScope = () => {
      const p = selectedProject();
      const names = p === null ? projectsInfo.map((x) => x.name) : [p];
      return names.filter((n) => !unlocked.has(n));
    };
    function lockedNote() {
      const locked = lockedInScope();
      if (!locked.length) return null;
      const p = selectedProject();
      const info = p && projectsInfo.find((x) => x.name === p);
      if (p && info && !info.hasKey) {
        return el('div', { className: 'locked-note' }, `“${p}” has no token yet.`,
          el('div', {}, el('button', { className: 'icon-btn', onclick: tokenDialog }, 'Generate token')));
      }
      return el('div', { className: 'locked-note' },
        p ? `“${p}” is locked. Its sessions are encrypted; unlock it with its token to read them.`
          : `${locked.length} locked project${locked.length === 1 ? '' : 's'} not shown: ${locked.join(', ')}. Pick one in the menu to unlock it.`,
        p ? el('div', {}, el('button', { className: 'icon-btn', onclick: () => unlockDialog(p) }, 'Unlock')) : null);
    }

    function renderList() {
      const f = filterInput.value.trim().toLowerCase();
      const shown = f
        ? sessions.filter((s) => (s.title + ' ' + s.id + ' ' + s.project).toLowerCase().includes(f))
        : sessions;
      $('count').textContent = sessions.length ? (f ? `${shown.length} of ${sessions.length}` : `${sessions.length}`) : '';
      listEl.innerHTML = '';
      const note = lockedNote();
      if (note) listEl.append(note);
      if (!shown.length) {
        if (!note || scopeProjects().length) {
          listEl.append(el('div', { className: 'placeholder' }, sessions.length ? 'No sessions match.' : 'No sessions yet.'));
        }
        return;
      }
      const showProject = selectedProject() === null;
      for (const s of shown) {
        const active = current && current.id === s.id && current.project === s.project;
        listEl.append(el('button', {
          className: 'sess' + (active ? ' active' : ''),
          title: `${s.id}\nCreated ${fmtFull(s.createdAt)}\nUpdated ${fmtFull(s.updatedAt)}`,
          onclick: () => openSession(s.project, s.id),
        },
          el('div', { className: 'title' }, s.title || s.id),
          el('div', { className: 'id mono' }, showProject ? [projectChip(s.project), ' '] : null, s.title ? s.id : ''),
          el('div', { className: 'times' },
            el('span', {}, 'Created ', fmtShort(s.createdAt)),
            el('span', {}, 'Updated ', fmtRel(s.updatedAt)),
          ),
        ));
      }
    }

    // ---------- routing ----------
    function setHash(params) {
      const h = new URLSearchParams(params).toString();
      if (location.hash.slice(1) !== h) history.pushState(null, '', h ? '#' + h : location.pathname + location.search);
    }
    function route() {
      const h = new URLSearchParams(location.hash.slice(1));
      if (h.has('s')) {
        showSession(h.get('p') || '', h.get('s'), h.get('l') ? Number(h.get('l')) : null);
      } else if (h.has('q')) {
        qInput.value = h.get('q');
        showSearch(h.get('q'));
      } else {
        current = null;
        document.body.classList.remove('viewing');
        renderList();
        showEmpty();
      }
    }
    function openSession(project, id, line) {
      setHash({ s: id, p: project, ...(line ? { l: line } : {}) });
      route();
    }

    function showEmpty() {
      content.innerHTML = '';
      content.append(el('div', { className: 'empty' },
        el('div', { className: 'big-orb' }),
        el('h3', {}, 'Pick a session'),
        el('p', {}, 'Choose a session on the left to read its full log, or search across transcripts above. Use the project menu to switch between accounts.'),
      ));
    }

    // ---------- session view ----------
    function textOf(content) {
      if (typeof content === 'string') return content;
      if (Array.isArray(content)) return content.filter((b) => b && b.type === 'text').map((b) => b.text).join('\n\n');
      return '';
    }
    const stringify = (v) => (typeof v === 'string' ? v : JSON.stringify(v, null, 2));
    const detailsBlock = (cls, label, bodyNode) =>
      el('details', { className: cls }, el('summary', {}, label), bodyNode);

    function userMsg(text, ts, line) {
      return el('div', { className: 'msg user', dataset: { line } },
        el('div', { className: 'avatar' }, 'You'),
        el('div', { className: 'stack' },
          el('div', { className: 'bubble' }, text),
          ts ? el('div', { className: 'meta', title: fmtFull(ts) }, fmtTime(ts)) : null,
        ));
    }
    function agentMsg(parts, ts, line, badge) {
      return el('div', { className: 'msg agent', dataset: { line } },
        el('div', { className: 'avatar' }, 'AI'),
        el('div', { className: 'stack' },
          ...parts,
          (ts || badge) ? el('div', { className: 'meta' },
            ts ? el('span', { title: fmtFull(ts) }, fmtTime(ts)) : null,
            badge || null) : null,
        ));
    }
    const bubble = (node) => el('div', { className: 'bubble' }, node);
    const thinkingBlock = (t) => detailsBlock('thinking', 'Thinking', el('div', { className: 'body' }, t));
    const toolUseBlock = (b) => detailsBlock('tool', ['🔧 ', el('span', { className: 'mono' }, b.name || 'tool')],
      el('pre', {}, stringify(b.input)));
    const toolResultBlock = (b) => detailsBlock('tool', ['↩ ', b.is_error ? 'Tool error' : 'Tool result'],
      el('pre', {}, typeof b.content === 'string' ? b.content : Array.isArray(b.content) ? b.content.map((c) => c.text || stringify(c)).join('\n') : stringify(b.content)));

    // One rendered row (or null) per stored line. Understands the chat-logger
    // format ({kind: prompt|response}) and raw Claude Code transcript lines
    // ({type: user|assistant, message}); anything else shows as a raw event.
    function renderLine({ line, data, text, error }) {
      if (error) {
        return el('div', { className: 'sys', dataset: { line } }, `⚠ Line ${line} could not be decrypted with this token`);
      }
      if (data === undefined) {
        return el('div', { className: 'event-row', dataset: { line } },
          detailsBlock('event', `Unparsed line ${line}`, el('pre', {}, text)));
      }
      const ts = data.ts || data.timestamp || null;
      if (data.kind === 'prompt') return userMsg(data.prompt || '', ts, line);
      if (data.kind === 'response') {
        const parts = [];
        if (data.thinking) parts.push(thinkingBlock(data.thinking));
        if (data.response) parts.push(bubble(mdNode(data.response)));
        const reason = String(data.reason || '');
        const badge = /abort|error|interrupt|cancel|fail/i.test(reason) ? el('span', { className: 'chip warn' }, reason) : null;
        return agentMsg(parts.length ? parts : [bubble(el('em', {}, '(empty response)'))], ts, line, badge);
      }
      if ((data.type === 'user' || data.type === 'assistant') && data.message) {
        const c = data.message.content;
        const blocks = Array.isArray(c) ? c : [{ type: 'text', text: typeof c === 'string' ? c : stringify(c) }];
        if (data.type === 'user') {
          const text = textOf(blocks);
          const tools = blocks.filter((b) => b && b.type === 'tool_result');
          if (text && !tools.length) return userMsg(text, ts, line);
          if (tools.length) return agentMsg(tools.map(toolResultBlock), ts, line);
          return null;
        }
        const parts = [];
        for (const b of blocks) {
          if (!b) continue;
          if (b.type === 'text' && b.text) parts.push(bubble(mdNode(b.text)));
          else if (b.type === 'thinking' && b.thinking) parts.push(thinkingBlock(b.thinking));
          else if (b.type === 'tool_use') parts.push(toolUseBlock(b));
        }
        return parts.length ? agentMsg(parts, ts, line) : null;
      }
      if (data.type === 'summary' && data.summary) {
        return el('div', { className: 'sys', dataset: { line }, title: data.summary }, '📝 ', data.summary);
      }
      const label = data.kind || data.type || data.msg || 'event';
      return el('div', { className: 'event-row', dataset: { line } },
        detailsBlock('event', [String(label).slice(0, 80), ts ? ` · ${fmtTime(ts)}` : ''], el('pre', {}, stringify(data))));
    }

    let loadSeq = 0;
    async function showSession(project, id, highlightLine) {
      current = { project, id };
      document.body.classList.add('viewing');
      renderList();
      const seq = ++loadSeq;
      content.innerHTML = '';
      content.append(el('div', { className: 'placeholder' }, 'Loading session…'));
      if (!unlocked.has(project)) {
        content.innerHTML = '';
        content.append(el('div', { className: 'empty' },
          el('h3', {}, `“${project}” is locked`),
          el('p', {}, 'This session is end-to-end encrypted. Unlock its project with the token to read it.'),
          el('button', { className: 'primary', onclick: () => unlockDialog(project) }, 'Unlock')));
        return;
      }
      let s;
      let entries;
      try {
        ({ s, entries } = await loadSession(project, id));
      } catch (err) {
        if (seq !== loadSeq) return;
        content.innerHTML = '';
        content.append(el('div', { className: 'placeholder' }, `Could not load session: ${err.message}`));
        return;
      }
      if (seq !== loadSeq) return;
      content.innerHTML = '';
      if (!s) {
        content.append(el('div', { className: 'placeholder' }, 'Session not found.'));
        return;
      }

      const backBtn = el('button', { className: 'icon-btn back', onclick: () => { setHash({}); route(); } }, '← Back');
      const copyBtn = el('button', {
        className: 'icon-btn', title: 'Copy session id',
        onclick: async () => {
          try { await navigator.clipboard.writeText(s.id); copyBtn.textContent = 'Copied'; } catch (_) { copyBtn.textContent = 'Copy failed'; }
          setTimeout(() => { copyBtn.textContent = 'Copy id'; }, 1200);
        },
      }, 'Copy id');
      content.append(el('div', { className: 'chat-head' },
        backBtn,
        el('div', { className: 'info' },
          el('h1', { title: s.title || s.id }, s.title || s.id),
          el('div', { className: 'sub' },
            projectChip(s.project),
            el('span', { className: 'mono' }, s.id),
            el('span', { title: fmtFull(s.createdAt) }, 'Created ', fmtFull(s.createdAt)),
            el('span', { title: fmtFull(s.updatedAt) }, 'Updated ', fmtRel(s.updatedAt)),
            el('span', {}, `${entries.length} entries`),
            entries.some((e) => e.plain) ? el('span', { className: 'chip warn', title: 'Stored before encryption: run scripts/scry-crypt.js migrate on the server' },
              `${entries.filter((e) => e.plain).length} unencrypted`) : null,
            entries.some((e) => e.error) ? el('span', { className: 'chip warn' }, `${entries.filter((e) => e.error).length} undecryptable`) : null,
          ),
        ),
        copyBtn,
      ));

      const thread = el('div', { className: 'thread' });
      let lastDay = '';
      for (const entry of entries) {
        const ts = entry.data && (entry.data.ts || entry.data.timestamp);
        if (ts && !Number.isNaN(Date.parse(ts))) {
          const day = fmtDay(ts);
          if (day !== lastDay) { thread.append(el('div', { className: 'day' }, day)); lastDay = day; }
        }
        const node = renderLine(entry);
        if (node) thread.append(node);
      }
      if (!entries.length) thread.append(el('div', { className: 'placeholder' }, 'This session is empty.'));
      const scroller = el('div', { id: 'scroller' }, thread);
      content.append(scroller);

      requestAnimationFrame(() => {
        const target = highlightLine ? thread.querySelector(`[data-line="${highlightLine}"]`) : null;
        scroller.style.scrollBehavior = 'auto';
        if (target) {
          target.scrollIntoView({ block: 'center' });
          target.classList.add('highlight');
          setTimeout(() => target.classList.remove('highlight'), 2500);
        } else {
          scroller.scrollTop = scroller.scrollHeight;
        }
        scroller.style.scrollBehavior = '';
      });
    }

    // ---------- search ----------
    function highlight(snippet, query) {
      const frag = document.createDocumentFragment();
      const lower = snippet.toLowerCase();
      const q = query.toLowerCase();
      let pos = 0;
      let idx;
      while (q && (idx = lower.indexOf(q, pos)) !== -1) {
        frag.append(snippet.slice(pos, idx), el('mark', {}, snippet.slice(idx, idx + q.length)));
        pos = idx + q.length;
      }
      frag.append(snippet.slice(pos));
      return frag;
    }

    let searchSeq = 0;
    async function showSearch(query) {
      current = null;
      document.body.classList.add('viewing');
      renderList();
      const seq = ++searchSeq;
      content.innerHTML = '';
      const wrap = el('div', { className: 'results' }, el('div', { className: 'results-head' }, 'Searching…'));
      content.append(el('div', { id: 'scroller' }, wrap));
      // Sessions are encrypted on the server, so search runs here: every
      // session in the unlocked projects in scope is fetched (cached by size),
      // decrypted and scanned.
      const MAX_HITS = 200;
      const q = query.toLowerCase();
      const hits = [];
      let done = 0;
      let failed = 0;
      try {
        const list = (await Promise.all(scopeProjects().map((p) => scry.sessions(p)))).flat()
          .sort((a, b) => (a.updatedAt < b.updatedAt ? 1 : -1));
        const queue = [...list];
        const worker = async () => {
          while (queue.length && hits.length < MAX_HITS && seq === searchSeq) {
            const sm = queue.shift();
            let entries;
            try {
              ({ entries } = await loadSession(sm.project, sm.id, sm.size));
            } catch (_) { failed++; continue; }
            for (const e of entries) {
              const idx = e.text.toLowerCase().indexOf(q);
              if (idx === -1) continue;
              const start = Math.max(0, idx - 60);
              hits.push({
                project: sm.project, session: sm.id, line: e.line,
                snippet: (start > 0 ? '…' : '') + e.text.slice(start, start + 200) + (e.text.length > start + 200 ? '…' : ''),
              });
              if (hits.length >= MAX_HITS) break;
            }
            done++;
            if (seq === searchSeq) wrap.firstChild.textContent = `Searching… ${done} of ${list.length} sessions decrypted`;
          }
        };
        await Promise.all([worker(), worker(), worker(), worker()]);
      } catch (err) {
        if (seq !== searchSeq) return;
        wrap.firstChild.textContent = `Search failed: ${err.message}`;
        return;
      }
      if (seq !== searchSeq) return;
      const sel = selectedProject();
      const scope = sel === null ? 'unlocked projects' : projectLabel(sel);
      const locked = lockedInScope();
      wrap.firstChild.textContent = `${hits.length}${hits.length >= MAX_HITS ? '+' : ''} result${hits.length === 1 ? '' : 's'} for “${query}” in ${scope}`
        + (locked.length ? ` (${locked.length} locked project${locked.length === 1 ? '' : 's'} not searched)` : '')
        + (failed ? ` · ${failed} session${failed === 1 ? '' : 's'} could not be loaded` : '');
      for (const h of hits) {
        wrap.append(el('button', {
          className: 'hit',
          onclick: () => openSession(h.project, h.session, h.line),
        },
          el('div', { className: 'loc' },
            projectChip(h.project), el('span', { className: 'mono' }, `${h.session} · line ${h.line}`)),
          el('div', { className: 'snippet mono' }, highlight(h.snippet, query)),
        ));
      }
    }

    function runSearch() {
      const query = qInput.value.trim();
      if (!query) return;
      setHash({ q: query });
      route();
    }

    // ---------- wiring ----------
    qInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') runSearch();
      if (e.key === 'Escape') { qInput.value = ''; qInput.blur(); }
    });
    filterInput.addEventListener('input', renderList);
    $('new-project').addEventListener('click', newProjectDialog);
    $('token-btn').addEventListener('click', tokenDialog);
    $('lock-btn').addEventListener('click', async () => {
      const p = selectedProject();
      if (!p) return;
      lockProject(p);
      await loadProjects(p);
      await loadSessions();
      route();
    });
    projectSel.addEventListener('change', async () => {
      store.set('scry.project', projectSel.value);
      updateTokenButton();
      const p = selectedProject();
      if (p && !unlocked.has(p) && projectsInfo.some((x) => x.name === p && x.hasKey)) unlockDialog(p);
      await loadSessions();
      const h = new URLSearchParams(location.hash.slice(1));
      if (h.has('q')) showSearch(h.get('q'));
    });
    $('refresh').addEventListener('click', async () => {
      await loadProjects();
      await loadSessions();
      route();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
        e.preventDefault();
        qInput.focus();
      }
    });
    window.addEventListener('popstate', route);
    // Keep the list fresh while the window is visible.
    setInterval(() => { if (!document.hidden) loadSessions(); }, 20000);

    (async () => {
      await loadProjects();
      await loadSessions();
      route();
    })();
  </script>
</body>
</html>
